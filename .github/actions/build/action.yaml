name: Set up and build
description: Builds spoutwire
inputs:
  target:
    description: Target architecture for dependencies
    required: true
  version:
    description: Version number for build
    required: true
  workingDirectory:
    description: Working directory for packaging
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Install Dependencies 🛍️
      shell: bash
      run: |
        : Install Dependencies 🛍️
        set -e

        echo ::group::Install Dependencies
        sudo apt-get update
        sudo apt-get install ccache meson ninja-build libdbus-1-dev libwine-dev mingw-w64 libgbm-dev libdrm-dev libvulkan-dev wine64-tools mingw-w64-tools pkg-config
        echo ::endgroup::
        echo ::group::Install Vulkan Headers for mingw32
        from=/usr/include
        to=/usr/x86_64-w64-mingw32/include
        for file in $(sudo dpkg -L libvulkan-dev); do
          if [[ "$file" == "$from"/* && -f "$file" ]]; then
            dest="$to${file#"$from"}"
            echo "${file} -> ${dest}"
            sudo mkdir -p "$(dirname $dest)"
            sudo cp $file $dest
          fi
        done
        echo ::endgroup::

    - name: Run Build
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CCACHE_DIR: ${{ inputs.workingDirectory }}/.ccache
      run: |
        : Run Build
        set -e

        ./build.sh

    - name: Package build
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CCACHE_DIR: ${{ inputs.workingDirectory }}/.ccache
      run: |
        : Package Build
        set -e

        mkdir release
        mv build/pkg "spoutwire-${{ inputs.version }}"
        tar cvzf release/"spoutwire-${{ inputs.version }}-bin".tar.gz "spoutwire-${{ inputs.version }}"
